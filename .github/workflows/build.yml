name: Build

# Builds the action, signed ad hoc, on every push to main and every pull
# request, and runs its script once. Needs no secrets.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build the action
        run: bin/build_actions.sh

      - name: Check the action
        run: |
          BUNDLE="build/Actions/Recent VS Code Opened Files.lbaction"
          EXE="$BUNDLE/Contents/MacOS/RecentVSCodeDocuments"
          lipo -archs "$EXE" | grep -q arm64
          lipo -archs "$EXE" | grep -q x86_64
          codesign --verify --strict --deep "$BUNDLE"
          test -x "$BUNDLE/Contents/Scripts/default.py"
          # The runner has no VS Code storage.json; the script prints an empty JSON list.
          OUT=$("$BUNDLE/Contents/Scripts/default.py")
          echo "$OUT"
          test "$OUT" = "[]"
