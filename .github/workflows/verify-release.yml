name: Verify Published Release

# Checks the Get-Recent-VS-Code-Documents-For-LaunchBar.zip attached to the latest published release — the file
# users download — the way a user's Mac would:
#   1. Build provenance: the ZIP was built by draft-release.yml from a tag.
#   2. The .lbaction bundle: signature (which seals default.py) and team,
#      notarization, and Gatekeeper accepts it as "Notarized Developer ID".
#   3. Contents: CFBundleVersion matches the tag, and default.py is executable.
#
# Runs weekly, when a release is published, and on demand. A check can fail with
# no new release, for example if Apple revokes the certificate or the ticket.
# Needs no secrets.

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays, 06:00 UTC
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: read       # download the release asset
  attestations: read   # read the build provenance attestation

jobs:
  verify:
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ github.token }}
      REPO:     ${{ github.repository }}
      TEAM_ID:  9V3X7C8VCK

    steps:
      - name: Download the latest release
        id: rel
        run: |
          # Without a tag, gh picks the latest release: not a draft, not a pre-release.
          TAG=$(gh release view --repo "$REPO" --json tagName -q .tagName)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          gh release download "$TAG" --repo "$REPO" --pattern Get-Recent-VS-Code-Documents-For-LaunchBar.zip
          shasum -a 256 Get-Recent-VS-Code-Documents-For-LaunchBar.zip
          echo "Latest release: $TAG"

      - name: Verify build provenance
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          gh attestation verify Get-Recent-VS-Code-Documents-For-LaunchBar.zip \
            --repo "$REPO" \
            --signer-workflow "$REPO/.github/workflows/draft-release.yml" \
            --source-ref "refs/tags/$TAG"

      - name: Extract the action
        run: ditto -x -k Get-Recent-VS-Code-Documents-For-LaunchBar.zip extracted

      - name: Verify the action bundle (signature, notarization, Gatekeeper)
        run: |
          for BUNDLE in extracted/*.lbaction; do
            codesign --verify --strict --deep --verbose=2 "$BUNDLE"
            TEAM=$(codesign -dv "$BUNDLE" 2>&1 | sed -n 's/^TeamIdentifier=//p')
            echo "TeamIdentifier: $TEAM"
            test "$TEAM" = "$TEAM_ID"
            codesign --verify --strict --check-notarization -R="notarized" --verbose "$BUNDLE"
            # --type open: what Gatekeeper checks when you double-click the action.
            # --type execute answers "does not seem to be an app" for an .lbaction.
            OUT=$(spctl --assess --type open --context context:primary-signature --verbose=4 "$BUNDLE" 2>&1 || true)
            echo "$OUT"
            echo "$OUT" | grep -q "source=Notarized Developer ID"
          done

      - name: Check the contents
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          BUNDLE="extracted/Recent VS Code Opened Files.lbaction"
          V=$(plutil -extract CFBundleVersion raw "$BUNDLE/Contents/Info.plist")
          echo "CFBundleVersion: $V"
          test "$V" = "${TAG#v}"
          test -x "$BUNDLE/Contents/Scripts/default.py"
